---
- name: Clone VM from Template with Static IP
  hosts: proxmox
  serial: 1
  vars:
    # Source template configuration
    source_vm_id: 3002      # Source template ID (3000=Ubuntu24, 3004=Ubuntu26, 3001=AlmaLinux, 3002=Fedora)
    os_type: "fedora"      # OS type: 'ubuntu24', 'ubuntu26', 'almalinux' or 'fedora'

    # New VM configuration
    new_vm_id: 8002         # New VM ID
    new_vm_name: "static-fedora-vm" # Desired hostname for the new VM
    cloud_user: "ansible"
    cloud_password: "{{ vault_cloud_password }}"  # Use ansible-vault
    ssh_public_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}" # Path to your public SSH key

    # Proxmox environment (values from inventory)
    target_node: "{{ proxmox_node }}"
    storage_pool: "{{ vm_storage_pool }}"
    full_clone: true
    recreate_vm: false

    # VM parameters (override template defaults)
    clone_vm_memory: 2048  # VM memory in MB
    clone_vm_cores: 2      # Number of CPU cores
    # clone_vm_disk_size: "20G"  # optional: resize disk (default = template disk size)

    # Network configuration (static IP)
    use_dhcp_ip: false  # Disable DHCP, use static IP instead
    static_ip_address: "192.168.1.102"  # Static IP address
    static_subnet_mask: "24"  # Subnet mask in CIDR format
    static_gateway: "192.168.1.1"  # Gateway


    # Bulk clone options (create N VMs from one template) — uncomment as needed:
    # vm_count: 4                 # create 4 VMs, IDs new_vm_id..new_vm_id+3
    # new_vm_ids: [8020, 8025]    # explicit ID list (takes priority over vm_count)
    # vm_name_pattern: "k8s-{index}"   # name template ({index} padded / {index_raw} raw)
    # vm_id_min: 0                # optional lower bound for generated IDs

  tasks:
    - name: Clone VM with Static IP
      ansible.builtin.include_role:
        name: opscores.proxmox_vm.clone_vm
# **Защита ID**: при `recreate_vm: false` запуск падает на коллизиях (target ID занят чужой ВМ),
# а шаблоны (`template: 1`) никогда не уничтожаются. См. [docs/operations.md](docs/operations.md#8-bulk-clone).
