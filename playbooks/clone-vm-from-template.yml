---
- name: Clone and Configure VM from Template
  hosts: proxmox
  serial: 1
  vars:
    # Source template configuration
    source_vm_id: 3001      # Source template ID (3000=Ubuntu24, 3004=Ubuntu26, 3001=AlmaLinux, 3002=Fedora)
    os_type: "almalinux"      # OS type: 'ubuntu24', 'ubuntu26', 'almalinux' or 'fedora'

    # New VM configuration
    new_vm_id: 8001         # New VM ID
    new_vm_name: "test-almalinux" # Desired hostname for the new VM
    cloud_user: "ansible"
    cloud_password: "{{ vault_cloud_password }}"  # Use ansible-vault
    ssh_public_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}" # Path to your public SSH key

    # Proxmox environment (values from inventory)
    target_node: "{{ proxmox_node }}"
    storage_pool: "{{ vm_storage_pool }}"
    full_clone: true

    # Optional: update VM config on skip (memory/cores/cpu) without recreating
    # update_vm_config: false   # default: false
    # scsi_disk_slot: scsi0     # if template uses non-standard slot (default: scsi0)

    # Bulk clone options (create N VMs from one template) — uncomment as needed:
    # vm_count: 4                 # create 4 VMs, IDs new_vm_id..new_vm_id+3
    # new_vm_ids: [8020, 8025]    # explicit ID list (takes priority over vm_count)
    # vm_name_pattern: "k8s-{index}"   # name template ({index} padded / {index_raw} raw)
    # vm_id_min: 0                # optional lower bound for generated IDs
    # static_ip_addresses:        # per-VM static IPs for bulk clone
    #   - "192.168.1.10"
    #   - "192.168.1.11"

  tasks:
    - name: Clone VM
      ansible.builtin.include_role:
        name: opscores.proxmox_vm.clone_vm
# **Защита ID**: при `recreate_vm: false` запуск падает на коллизии (target ID занят чужой ВМ),
# а шаблоны (`template: 1`) никогда не уничтожаются. См. [docs/operations.md](docs/operations.md#8-bulk-clone).
