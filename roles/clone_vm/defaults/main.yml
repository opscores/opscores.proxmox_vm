# defaults/main.yml
ansible_become: true
snippets_path: "/var/lib/vz/snippets"
snippets_storage: "local"
vm_storage_pool: "local-lvm"
storage_pool: "{{ vm_storage_pool }}"
storage_min_free_gb: 10

dns_servers: "8.8.8.8 8.8.4.4"
search_domains: "local"

vm_resize_disk: true
clone_vm_disk_size: ""
clone_vm_disk_slot: "scsi0"  # disk slot to resize (override if template uses another slot)

# Bulk clone options (create N VMs from one template)
vm_count: 1                          # number of VMs to clone (default 1 = backward compat)
new_vm_ids: []                       # explicit list of VM IDs (takes priority over vm_count)
vm_name_pattern: ""                  # name template with {index} (padded) / {index_raw} placeholders
vm_name_index_padding: 2             # 0 = no padding, >0 = min digits (auto-scales up for large counts)
vm_id_min: 0                         # optional lower bound for generated IDs (0 = no limit)

clone_vm_memory: "{{ vm_memory | default(omit) }}"
clone_vm_cores: "{{ vm_cores | default(omit) }}"
clone_vm_ostype: "{{ vm_ostype | default(omit) }}"
clone_vm_machine: "{{ vm_machine | default(omit) }}"
clone_vm_bios: "{{ vm_bios | default(omit) }}"
clone_vm_cpu: "{{ vm_cpu | default(omit) }}"
clone_vm_scsihw: "{{ vm_scsihw | default('virtio-scsi-pci') }}"
clone_vm_agent: "{{ vm_agent | default('enabled=1') }}"

recreate_vm: false

# Optional: update VM config (memory/cores/cpu) on skip instead of doing nothing
update_vm_config: false

use_dhcp_ip: true
static_ip_address: ""
static_ip_addresses: []   # per-VM static IPs for bulk clone (takes priority over static_ip_address when non-empty)
static_subnet_mask: "24"
static_gateway: ""

# Cloud-init required variables (must be set in playbook/inventory)
cloud_user: ""
cloud_password: ""
ssh_public_key: ""
timezone: "Europe/Moscow"
target_node: "{{ ansible_hostname }}"


