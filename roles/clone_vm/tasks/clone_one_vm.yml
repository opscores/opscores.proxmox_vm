---
# tasks/clone_one_vm.yml
# Per-VM clone flow for the clone_vm role.
# Included once per VM by tasks/main.yml (orchestrator) via include_tasks + loop.
# Variables new_vm_id and new_vm_name are injected by the orchestrator per iteration.

# ============================================================
# Remove existing VM (recreate)
# ============================================================

# Check if VM config exists for {{ new_vm_id }}
- name: "Check if VM config file exists for ID {{ new_vm_id }}"
  ansible.builtin.command:
    cmd: "qm status {{ new_vm_id }}"
  register: cv_vm_config_exists
  changed_when: false
  failed_when: false

# Read existing VM config (if exists) — for template protection and collision detection
- name: "Read existing VM config (if exists)"
  ansible.builtin.shell:
    cmd: "qm config {{ new_vm_id }} 2>/dev/null || true"
  register: cv_existing_vm_config
  changed_when: false
  failed_when: false
  when: cv_vm_config_exists.rc == 0

# Abort if target ID is a template (safety — even with recreate_vm=true)
- name: "Abort if target ID is a template"
  ansible.builtin.fail:
    msg: "VM ID {{ new_vm_id }} is a template, not a VM. Refusing to proceed. Choose a different ID."
  when:
    - cv_vm_config_exists.rc == 0
    - "'template: 1' in (cv_existing_vm_config.stdout | default(''))"

# Read existing VM name (if exists) — for collision detection and recreate ownership check
- name: "Read existing VM name (if exists)"
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ new_vm_id }} | grep -m1 '^name:' | awk '{print $2}'"
  register: cv_existing_vm_name
  changed_when: false
  failed_when: false
  when: cv_vm_config_exists.rc == 0

# Fail on foreign VM ID collision (same ID, different name)
- name: "Fail on VM ID collision (foreign VM)"
  ansible.builtin.fail:
    msg: >
      VM ID {{ new_vm_id }} already exists with name '{{ cv_existing_vm_name.stdout | default('') | trim }}'
      (expected '{{ new_vm_name }}'). Set recreate_vm=true or choose different IDs.
  when:
    - cv_vm_config_exists.rc == 0
    - not (recreate_vm | bool)
    - "'template: 1' not in (cv_existing_vm_config.stdout | default(''))"
    - (cv_existing_vm_name.stdout | default('') | trim) != new_vm_name

# Fail on recreate if target ID is owned by a different VM (ownership check)
- name: "Fail on recreate of foreign VM (ownership check)"
  ansible.builtin.fail:
    msg: >
      VM ID {{ new_vm_id }} is owned by '{{ cv_existing_vm_name.stdout | default('') | trim }}'
      (expected '{{ new_vm_name }}'). Refusing to destroy. Choose a different ID or set recreate_vm=false.
  when:
    - cv_vm_config_exists.rc == 0
    - recreate_vm | bool
    - "'template: 1' not in (cv_existing_vm_config.stdout | default(''))"
    - (cv_existing_vm_name.stdout | default('') | trim) != new_vm_name

# Check whether the existing VM is currently running (to avoid qm stop on an already-stopped VM)
- name: "Check if existing VM is running (ID {{ new_vm_id }})"
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm status {{ new_vm_id }} | grep -q 'stopped' && echo stopped || echo running"
  register: cv_vm_running_check
  changed_when: false
  failed_when: false
  when: cv_vm_config_exists.rc == 0 and recreate_vm | bool

# ============================================================
# Optional: update VM config on skip (update_vm_config=true)
# ============================================================
# When VM exists, name matches, and recreate=false, the clone is skipped.
# If update_vm_config=true, reconcile memory/cores/cpu with desired values.
- name: "Get current VM memory (for config update)"
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ new_vm_id }} | awk '/^memory:/{print $2}'"
  register: cv_cur_mem
  changed_when: false
  failed_when: false
  when:
    - cv_vm_config_exists.rc == 0
    - not (recreate_vm | bool)
    - (update_vm_config | default(false) | bool)
    - clone_vm_memory is defined
    - clone_vm_memory != omit

- name: "Update VM memory if changed"
  ansible.builtin.command:
    cmd: "qm set {{ new_vm_id }} --memory {{ clone_vm_memory }}"
  when:
    - cv_vm_config_exists.rc == 0
    - not (recreate_vm | bool)
    - (update_vm_config | default(false) | bool)
    - clone_vm_memory is defined
    - clone_vm_memory != omit
    - (clone_vm_memory | string | trim | length > 0)
    - (cv_cur_mem.stdout | default('') | trim | int) != (clone_vm_memory | int)
  changed_when: true
  failed_when: false

- name: "Get current VM cores (for config update)"
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ new_vm_id }} | awk '/^cores:/{print $2}'"
  register: cv_cur_cores
  changed_when: false
  failed_when: false
  when:
    - cv_vm_config_exists.rc == 0
    - not (recreate_vm | bool)
    - (update_vm_config | default(false) | bool)
    - clone_vm_cores is defined
    - clone_vm_cores != omit

- name: "Update VM cores if changed"
  ansible.builtin.command:
    cmd: "qm set {{ new_vm_id }} --cores {{ clone_vm_cores }}"
  when:
    - cv_vm_config_exists.rc == 0
    - not (recreate_vm | bool)
    - (update_vm_config | default(false) | bool)
    - clone_vm_cores is defined
    - clone_vm_cores != omit
    - (clone_vm_cores | string | trim | length > 0)
    - (cv_cur_cores.stdout | default('') | trim | int) != (clone_vm_cores | int)
  changed_when: true
  failed_when: false

- name: "Get current VM cpu (for config update)"
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ new_vm_id }} | awk '/^cpu:/{print $2}'"
  register: cv_cur_cpu
  changed_when: false
  failed_when: false
  when:
    - cv_vm_config_exists.rc == 0
    - not (recreate_vm | bool)
    - (update_vm_config | default(false) | bool)
    - clone_vm_cpu is defined
    - clone_vm_cpu != omit

- name: "Update VM cpu if changed"
  ansible.builtin.command:
    cmd: "qm set {{ new_vm_id }} --cpu {{ clone_vm_cpu }}"
  when:
    - cv_vm_config_exists.rc == 0
    - not (recreate_vm | bool)
    - (update_vm_config | default(false) | bool)
    - clone_vm_cpu is defined
    - clone_vm_cpu != omit
    - (clone_vm_cpu | string | trim | length > 0)
    - (cv_cur_cpu.stdout | default('') | trim) != (clone_vm_cpu | string | trim)
  changed_when: true
  failed_when: false

# Stop existing VM (only if it is currently running; recreate=true)
- name: "Stop existing VM if it is running and recreate is true (ID {{ new_vm_id }})"
  ansible.builtin.command:
    cmd: "qm stop {{ new_vm_id }}"
  when:
    - cv_vm_config_exists.rc == 0
    - recreate_vm | bool
    - (cv_vm_running_check.stdout | default('') | trim) != 'stopped'
  failed_when: false
  register: cv_stop_result
  changed_when: true
  until: cv_stop_result.rc == 0
  retries: 3
  delay: 10

# Unlock VM (in case of interrupted clone) before destroy
- name: "Unlock existing VM if locked (ID {{ new_vm_id }})"
  ansible.builtin.command:
    cmd: "qm unlock {{ new_vm_id }}"
  when: cv_vm_config_exists.rc == 0 and recreate_vm | bool
  failed_when: false
  changed_when: false

# Destroy existing VM (if exists and recreate=true)
- name: "Destroy existing VM if it exists and recreate is true (ID {{ new_vm_id }})"
  ansible.builtin.command:
    cmd: "qm destroy {{ new_vm_id }} --purge"
  when: cv_vm_config_exists.rc == 0 and recreate_vm | bool
  register: cv_destroy_result
  changed_when: true

# Report deletion
- name: "Report that existing VM was destroyed"
  ansible.builtin.debug:
    msg: "Removed existing VM with ID {{ new_vm_id }} to proceed with creation."
  when: cv_vm_config_exists.rc == 0 and recreate_vm | bool and cv_destroy_result is defined and cv_destroy_result.changed

# Clean up orphaned cloud-init snippet
- name: "Clean up orphaned cloud-init snippet for recreated VM"
  ansible.builtin.file:
    path: "{{ snippets_path | regex_replace('/$', '') }}/ci-{{ new_vm_id }}.yaml"
    state: absent
  when: cv_vm_config_exists.rc == 0 and recreate_vm | bool

# ============================================================
# Validation and cloning
# ============================================================

# Verify source template exists
- name: "Check if source template exists and is a template"
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ source_vm_id }} | grep -qx 'template: 1'"
  register: cv_template_check
  changed_when: false
  failed_when: cv_template_check.rc != 0
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool

# Clone VM from template
- name: "Clone VM from template"
  ansible.builtin.command:
    cmd: >-
      qm clone {{ source_vm_id }} {{ new_vm_id }} --name {{ new_vm_name }}
      --full {{ full_clone | ternary('1', '0') }}
      {% if target_node | default('') != '' and target_node != ansible_hostname %}--target {{ target_node }}{% endif %}
      {% if full_clone | bool %}--storage {{ storage_pool }}{% endif %}
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool
  register: cv_clone_result
  changed_when: true
  until: cv_clone_result.rc == 0
  retries: 3
  delay: 10

# ============================================================
# Hardware configuration
# ============================================================

- name: "Configure VM hardware (memory, cores, ostype, machine, bios, cpu, scsihw, agent)"
  ansible.builtin.command:
    cmd: >-
      qm set {{ new_vm_id }}
      {% if clone_vm_memory is defined and clone_vm_memory != omit and
            (clone_vm_memory | string | trim | length) > 0 %}--memory {{ clone_vm_memory }} {% endif %}
      {% if clone_vm_cores is defined and clone_vm_cores != omit and (clone_vm_cores | string | trim | length) > 0 %}--cores {{ clone_vm_cores }} {% endif %}
      {% if clone_vm_ostype is defined and clone_vm_ostype != omit and
            (clone_vm_ostype | string | trim | length) > 0 %}--ostype {{ clone_vm_ostype }} {% endif %}
      {% if clone_vm_machine is defined and clone_vm_machine != omit and
            (clone_vm_machine | string | trim | length) > 0 %}--machine {{ clone_vm_machine }} {% endif %}
      {% if clone_vm_bios is defined and clone_vm_bios != omit and (clone_vm_bios | string | trim | length) > 0 %}--bios {{ clone_vm_bios }} {% endif %}
      {% if clone_vm_cpu is defined and clone_vm_cpu != omit and (clone_vm_cpu | string | trim | length) > 0 %}--cpu {{ clone_vm_cpu }} {% endif %}
      {% if clone_vm_scsihw is defined and clone_vm_scsihw != omit and
            (clone_vm_scsihw | string | trim | length) > 0 %}--scsihw {{ clone_vm_scsihw }} {% endif %}
      {% if clone_vm_agent is defined and clone_vm_agent != omit and (clone_vm_agent | string | trim | length) > 0 %}--agent {{ clone_vm_agent }} {% endif %}
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool
  register: cv_config_result
  changed_when: "cv_config_result.stderr | length > 0"
  failed_when: cv_config_result.rc != 0 and 'no state change' not in cv_config_result.stderr
  until: cv_config_result.rc == 0
  retries: 3
  delay: 10

# ============================================================
# Disk
# ============================================================

# Get current disk size
- name: "Get current disk size for VM disk slot {{ clone_vm_disk_slot }}"
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ new_vm_id }} | grep -E '{{ clone_vm_disk_slot }}.*size=' | head -1"
  register: cv_current_size_raw
  changed_when: false
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and cv_should_resize_disk

# Validate new disk size is larger than current
- name: "Validate new disk size is larger than current for {{ clone_vm_disk_slot }}"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      CURRENT=$(echo "{{ cv_current_size_raw.stdout }}" | grep -oP '{{ clone_vm_disk_slot }}.*size=\K[^,]*' || echo '') && \
      NEW="{{ clone_vm_disk_size }}" && \
      if [ "${CURRENT}" = "" ]; then exit 0; fi && \
      CUR_VAL="${CURRENT%[GgMm]}"; CUR_UNIT="${CURRENT: -1}" && \
      NEW_VAL="${NEW%[GgMm]}"; NEW_UNIT="${NEW: -1}" && \
      if [ "$CUR_UNIT" = "M" ]; then CUR_MB="$CUR_VAL"; elif [ "$CUR_UNIT" = "G" ]; then CUR_MB=$(( CUR_VAL * 1024 )); else CUR_MB="$CUR_VAL"; fi && \
      if [ "$NEW_UNIT" = "G" ]; then NEW_MB=$(( NEW_VAL * 1024 )); elif [ "$NEW_UNIT" = "M" ]; then NEW_MB="$NEW_VAL"; else NEW_MB="$NEW_VAL"; fi && \
      if [[ "$NEW_MB" =~ ^[0-9]+$ ]] && (( NEW_MB >= CUR_MB )); then echo "OK: ${NEW} >= ${CURRENT}"; else exit 1; fi
    executable: /bin/bash
  register: cv_disk_validation
  changed_when: false
  failed_when: false
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and cv_should_resize_disk

# Fail if new disk size is not larger than current
- name: "Fail if new disk size is not larger than current"
  ansible.builtin.fail:
    msg: >
      Disk resize would shrink {{ clone_vm_disk_slot }} from {{ cv_current_size_raw.stdout }} to {{ clone_vm_disk_size }}.
      Resize only supports expanding disks, not shrinking them.
  when:
    - cv_should_resize_disk
    - cv_disk_validation is not skipped
    - cv_disk_validation.rc is defined
    - cv_disk_validation.rc != 0

# Resize VM disk if enabled
- name: "Resize VM disk if enabled"
  ansible.builtin.command:
    cmd: "qm resize {{ new_vm_id }} {{ clone_vm_disk_slot }} {{ clone_vm_disk_size }}"
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and cv_should_resize_disk
  register: cv_resize_result
  changed_when: "cv_resize_result.stderr | length > 0"
  failed_when: cv_resize_result.rc != 0 and 'no state change' not in cv_resize_result.stderr
  until: cv_resize_result.rc == 0
  retries: 3
  delay: 10

# Wait for disk resize to complete and verify
- name: "Wait for disk resize to complete and verify"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail; qm config {{ new_vm_id }} |
      grep -oP '{{ clone_vm_disk_slot }}.*size=\K[^,]*' |
      awk '{ s=$0; u=toupper(substr(s,length(s),1)); v=s; sub(/[A-Za-z]$/,"",v);
             if (u=="G") print v*1024; else if (u=="M") print v;
             else if (u=="T") print v*1048576; else print v }'
  register: cv_disk_size_check
  changed_when: false
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and cv_should_resize_disk and cv_resize_result is succeeded
  retries: 5
  delay: 5
  until: (cv_disk_size_check.stdout | int) >= (cv_expected_disk_size_mb | int)

# ============================================================
# Cloud-init
# ============================================================

# Report when disk resize was not requested (template size retained)
- name: "Report disk resize skipped (template size retained)"
  ansible.builtin.debug:
    msg: >
      Disk resize not requested (clone_vm_disk_size empty or vm_resize_disk false).
      VM keeps the template disk size for {{ clone_vm_disk_slot }}.
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and not cv_should_resize_disk

# Fail if cloud-init template not found
- name: "Fail if cloud-init template not found"
  ansible.builtin.fail:
    msg: >
      Cloud-init template for os_type='{{ os_type }}' not found.
      Available: {{ lookup('fileglob', role_path ~ '/templates/cloud-init-*.yaml.j2', wantlist=True)
                    | map('basename') | map('regex_replace', '^cloud-init-|\.yaml\.j2$', '') | list }}
  when: lookup('fileglob', role_path ~ '/templates/cloud-init-' ~ os_type ~ '.yaml.j2') == ''

# Determine effective static IP for this VM (per-VM list takes priority over single value)
- name: "Determine effective static IP for {{ new_vm_name }}"
  ansible.builtin.set_fact:
    cv_effective_static_ip: >-
      {% set ips = static_ip_addresses | default([]) %}
      {% if ips | length > 0 %}{{ ips[cv_vm_index | default(0) | int] | trim }}{% else %}{{ static_ip_address | trim }}{% endif %}
  changed_when: false
  when: not (use_dhcp_ip | default(true) | bool)

# Fail if static IP configured without required addresses
- name: "Fail if static IP configured without required addresses"
  ansible.builtin.fail:
    msg: >
      use_dhcp_ip is false but static_ip_address or static_gateway is empty.
      Set static_ip_address='{{ static_ip_address }}' and static_gateway='{{ static_gateway }}'
      or enable use_dhcp_ip=true.
  when: >
    not (use_dhcp_ip | default(true) | bool) and
    (((static_ip_address == "") and (static_ip_addresses | default([]) | length == 0)) or (static_gateway == ""))

# Generate cloud-init user data from template
- name: "Generate complete cloud-init user data from template"
  ansible.builtin.template:
    src: "templates/cloud-init-{{ os_type }}.yaml.j2"
    dest: "{{ snippets_path | regex_replace('/$', '') }}/ci-{{ new_vm_id }}.yaml"
    mode: '0600'
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool

# Configure cloud-init (DHCP)
- name: "Configure cloud-init with DHCP for new VM {{ new_vm_name }}"
  ansible.builtin.command:
    cmd: >-
      qm set {{ new_vm_id }} --cicustom user={{ snippets_storage }}:snippets/ci-{{ new_vm_id }}.yaml
      --ipconfig0 ip=dhcp --nameserver '{{ dns_servers }}'
      --searchdomain '{{ search_domains }}' --ciupgrade 0
  when: (cv_vm_config_exists.rc != 0 or recreate_vm | bool) and (use_dhcp_ip | default(true))
  register: cv_set_dhcp_result
  changed_when: "cv_set_dhcp_result.stderr | length > 0"
  until: cv_set_dhcp_result.rc == 0
  retries: 3
  delay: 10

# Configure cloud-init (static IP)
- name: "Configure cloud-init with static IP for new VM {{ new_vm_name }}"
  ansible.builtin.command:
    cmd: >-
      qm set {{ new_vm_id }} --cicustom user={{ snippets_storage }}:snippets/ci-{{ new_vm_id }}.yaml
      --ipconfig0 'ip={{ cv_effective_static_ip | trim }}/{{ static_subnet_mask }},gw={{ static_gateway }}'
      --nameserver '{{ dns_servers }}' --searchdomain '{{ search_domains }}' --ciupgrade 0
  when:
    - (cv_vm_config_exists.rc != 0 or recreate_vm | bool)
    - (not (use_dhcp_ip | default(true)))
    - (cv_effective_static_ip | default('') | trim | length > 0)
    - (static_gateway | default('') | trim | length > 0)
  register: cv_set_static_result
  changed_when: "cv_set_static_result.stderr | length > 0"
  until: cv_set_static_result.rc == 0
  retries: 3
  delay: 10

# Update cloud-init drive
- name: "Update cloud-init drive with new data"
  ansible.builtin.command:
    cmd: "qm cloudinit update {{ new_vm_id }}"
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool
  register: cv_ci_update_result
  changed_when: "cv_ci_update_result.stderr | length > 0"
  until: cv_ci_update_result.rc == 0
  retries: 3
  delay: 10

# ============================================================
# Startup
# ============================================================

# Start VM
- name: "Start the new VM {{ new_vm_name }}"
  ansible.builtin.command:
    cmd: "qm start {{ new_vm_id }}"
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool
  register: cv_start_result
  changed_when: true
  until: cv_start_result.rc == 0
  retries: 3
  delay: 10

# Final output
- name: "Final Output"
  ansible.builtin.debug:
    msg: "VM {{ new_vm_name }} (ID: {{ new_vm_id }}) created and started successfully."
  when: cv_vm_config_exists.rc != 0 or recreate_vm | bool
