---
# tasks file for clone_vm role
# Orchestrator: global preflight + build VM list + loop over clone_one_vm.yml

# ============================================================
# Preflight checks (global, run once)
# ============================================================

# 0. Detect Proxmox VE major version (non-blocking, informational)
- name: "Preflight — detect Proxmox VE major version"
  ansible.builtin.shell:
    cmd: "set -o pipefail; pveversion | grep -oP 'pve-manager/\\K[0-9]+' || echo unknown"
  register: cv_pve_version
  changed_when: false

- name: "Preflight — warn if Proxmox VE major version is not the tested target (9.x)"
  ansible.builtin.debug:
    msg: >
      WARNING: detected Proxmox VE major version '{{ cv_pve_version.stdout }}'.
      This collection is developed and tested against Proxmox VE 9.x. It only uses
      generic `qm`/`pvesm` CLI commands with no version-specific flags, so other
      versions may work, but have not been verified. Proceeding anyway.
  when: cv_pve_version.stdout != "9"

# 1. Verify target storage exists and is active
- name: "Preflight — verify target storage exists and active ({{ storage_pool }})"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail; pvesm status |
      awk -v pool='{{ storage_pool }}'
      'NR==1 {for(i=1;i<=NF;i++) if($i=="Status") st=i}
      NR>1 && $1==pool && $st=="active" {print $0}'
  register: cv_storage_active
  failed_when: cv_storage_active.stdout == ""
  changed_when: false

# 2. Check free space in storage_pool
- name: "Preflight — check free space in {{ storage_pool }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail; pvesm status |
      awk -v pool='{{ storage_pool }}'
      '$1 == pool {print $6}'
  register: cv_storage_free
  failed_when: (cv_storage_free.stdout | int / 1048576) | int < storage_min_free_gb
  changed_when: false

# 4. Verify local storage supports snippets
- name: "Verify local storage supports snippets"
  ansible.builtin.shell:
    cmd: >-
      awk -v st='{{ snippets_storage }}'
      '/^[^[:space:]]/ { in_st = ($2 == st) ? 1 : 0 }
      in_st && /^[[:space:]]/ && /content/ && /snippets/ { found=1 }
      END { exit (found ? 0 : 1) }' /etc/pve/storage.cfg
  register: cv_snippets_check
  changed_when: false
  failed_when: cv_snippets_check.rc != 0

# 5a. Determine whether disk resize is requested
- name: "Determine if disk resize is requested for {{ clone_vm_disk_slot }}"
  ansible.builtin.set_fact:
    cv_should_resize_disk: >-
      {{ (vm_resize_disk | bool) and (clone_vm_disk_size | string | trim) | length > 0 }}
  changed_when: false

# 5b. Compute expected disk size in MB (for unit-safe verification)
- name: "Compute expected disk size in MB for verification"
  ansible.builtin.set_fact:
    cv_expected_disk_size_mb: >-
      {% set s = (clone_vm_disk_size | string) | trim %}
      {% if s[-1] | upper == 'G' %}{{ (s[:-1] | int) * 1024 }}
      {% elif s[-1] | upper == 'M' %}{{ s[:-1] | int }}
      {% elif s[-1] | upper == 'T' %}{{ (s[:-1] | int) * 1048576 }}
      {% else %}{{ s | int }}{% endif %}
  changed_when: false
  when: cv_should_resize_disk

# 5. Validate required variables
- name: "Validate required variables are defined"
  ansible.builtin.assert:
    that:
      - source_vm_id is defined
      - os_type is defined
      - target_node is defined
      - target_node | string | trim | length > 0
      - storage_pool is defined
      - full_clone is defined
      - cloud_user is defined
      - cloud_user | string | trim | length > 0
      - cloud_password is defined
      - cloud_password | string | trim | length > 0
      - ssh_public_key is defined
      - ssh_public_key | string | trim | length > 0
      - new_vm_name is defined
      - new_vm_name | string | trim | length > 0
      - (new_vm_id is defined) or (new_vm_ids | default([]) | length > 0)
    fail_msg: >
      Missing required variable(s). Required: source_vm_id, os_type, target_node, storage_pool,
      full_clone, cloud_user (non-empty), cloud_password (non-empty), ssh_public_key (non-empty),
      new_vm_name (non-empty), and either new_vm_id (base ID, required when new_vm_ids empty)
      or new_vm_ids (non-empty explicit list).
      Current values: source_vm_id={{ source_vm_id | default('UNDEFINED') }},
      new_vm_id={{ new_vm_id | default('UNDEFINED') }},
      new_vm_name={{ new_vm_name | default('UNDEFINED') }},
      os_type={{ os_type | default('UNDEFINED') }},
      target_node={{ target_node | default('UNDEFINED') }},
      storage_pool={{ storage_pool | default('UNDEFINED') }},
      full_clone={{ full_clone | default('UNDEFINED') }},
      cloud_user={{ cloud_user | default('***redacted***') }}, cloud_password=***redacted***,
      ssh_public_key={{ ssh_public_key | default('***redacted***') }}

# Validate vm_count
- name: "Validate vm_count is a positive integer"
  ansible.builtin.assert:
    that:
      - vm_count | int >= 1
    fail_msg: "vm_count must be >= 1, got {{ vm_count }}"

# Validate static IP format (when not using DHCP)
- name: "Validate static_ip_address format"
  ansible.builtin.assert:
    that:
      - static_ip_address is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
    fail_msg: "Invalid static_ip_address format: {{ static_ip_address }} (expected IPv4)"
  when:
    - not (use_dhcp_ip | default(true) | bool)
    - (static_ip_address | default('') | trim | length > 0)

- name: "Validate static_ip_addresses format"
  ansible.builtin.assert:
    that:
      - item is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
    fail_msg: "Invalid static IP in static_ip_addresses: {{ item }}"
  loop: "{{ static_ip_addresses | default([]) }}"
  when: not (use_dhcp_ip | default(true) | bool)

# Build the list of VMs to clone (raw string, then parse to a real list)
- name: "Build raw list of VMs to clone (count={{ vm_count }})"
  ansible.builtin.set_fact:
    cv_vm_list_raw: >-
      {% set ids = [] %}
      {% if new_vm_ids | default([]) | length > 0 %}
      {% for id in new_vm_ids %}
      {% set _ = ids.append(id | int) %}
      {% endfor %}
      {% else %}
      {% for i in range(vm_count | int) %}
      {% set _ = ids.append((new_vm_id | int) + i) %}
      {% endfor %}
      {% endif %}
      {% set count = ids | length %}
      {% set pad_raw = vm_name_index_padding | default(2) | int %}
      {% if pad_raw <= 0 %}
      {% set pad = 0 %}
      {% else %}
      {% set pad = [pad_raw, (count | string | length) | int] | max %}
      {% endif %}
      {% set result = [] %}
      {% for i in range(count) %}
      {% set idx = i + 1 %}
      {% if pad_raw <= 0 %}
      {% set padded = idx | string %}
      {% else %}
      {% set padded = '%0*d' | format(pad, idx) %}
      {% endif %}
      {% set raw = idx | string %}
      {% if vm_name_pattern | default('') | length > 0 %}
      {% set vmname = vm_name_pattern | replace('{index}', padded) | replace('{index_raw}', raw) %}
      {% elif count == 1 %}
      {% set vmname = new_vm_name %}
      {% else %}
      {% set vmname = new_vm_name ~ '-' ~ padded %}
      {% endif %}
      {% set _ = result.append({'id': ids[i], 'name': vmname}) %}
      {% endfor %}
      {{ result }}
  changed_when: false

# Parse the rendered string into a real list (Ansible otherwise keeps it as a string)
- name: "Parse VM list into a real list"
  ansible.builtin.set_fact:
    cv_vm_list: "{{ cv_vm_list_raw | from_yaml }}"
  changed_when: false

# Validate vm_name_pattern contains an index placeholder when cloning more than one VM
- name: "Validate vm_name_pattern contains {index} or {index_raw} when vm_count > 1"
  ansible.builtin.assert:
    that:
      - >-
        (cv_vm_list | length <= 1) or (vm_name_pattern | default('') | length == 0)
        or ('{index}' in (vm_name_pattern | default('')))
        or ('{index_raw}' in (vm_name_pattern | default('')))
    fail_msg: >
      vm_name_pattern must contain {index} or {index_raw} when cloning more than one VM,
      otherwise all VMs would share the same name. Got: '{{ vm_name_pattern }}'
  when: (cv_vm_list | length > 1)

# Validate static_ip_addresses length matches VM count (when provided)
- name: "Validate static_ip_addresses length matches VM count"
  ansible.builtin.assert:
    that:
      - (static_ip_addresses | default([]) | length == 0) or (static_ip_addresses | default([]) | length == (cv_vm_list | length))
    fail_msg: >
      static_ip_addresses has {{ static_ip_addresses | default([]) | length }} entries
      but {{ cv_vm_list | length }} VMs will be cloned. Provide one IP per VM or leave empty.
  when: not (use_dhcp_ip | default(true) | bool)

# Validate generated IDs are in Proxmox range
- name: "Validate generated VM IDs are in Proxmox range"
  ansible.builtin.assert:
    that:
      - item.id | int >= 100
      - item.id | int <= 999999999
    fail_msg: "Generated VM ID {{ item.id }} is out of Proxmox range (100-999999999)"
  loop: "{{ cv_vm_list }}"

# Validate generated IDs against vm_id_min (if set)
- name: "Validate generated VM IDs against vm_id_min"
  ansible.builtin.assert:
    that:
      - item.id | int >= (vm_id_min | default(0) | int)
    fail_msg: "Generated VM ID {{ item.id }} is below vm_id_min {{ vm_id_min }}"
  loop: "{{ cv_vm_list }}"
  when: vm_id_min | default(0) | int > 0

# Validate generated hostnames are RFC 1123 compliant
- name: "Validate generated hostnames are RFC 1123 compliant"
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-zA-Z0-9]([a-zA-Z0-9\\-]{0,61}[a-zA-Z0-9])?(\\.[a-zA-Z0-9]([a-zA-Z0-9\\-]{0,61}[a-zA-Z0-9])?)*$')
    fail_msg: "Generated hostname '{{ item.name }}' is not RFC 1123 compliant"
  loop: "{{ cv_vm_list }}"

# Validate new_vm_ids has no duplicates
- name: "Validate new_vm_ids has no duplicates"
  ansible.builtin.assert:
    that:
      - (new_vm_ids | default([])) | unique | length == (new_vm_ids | default([])) | length
    fail_msg: "new_vm_ids contains duplicate IDs"
  when: new_vm_ids | default([]) | length > 0

# (Collision handling moved into clone_one_vm.yml: existing VMs with a different
#  name fail; same name means idempotent skip.)

# Verify source template exists (once)
- name: "Check if source template exists and is a template"
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ source_vm_id }} | grep -qx 'template: 1'"
  register: cv_source_template_check
  changed_when: false
  failed_when: cv_source_template_check.rc != 0

# ============================================================
# Clone each VM
# ============================================================

- name: "Clone VMs from template (count={{ cv_vm_list | length }})"
  ansible.builtin.include_tasks: clone_one_vm.yml
  loop: "{{ cv_vm_list }}"
  loop_control:
    loop_var: cv_vm
    index_var: cv_vm_index
  vars:
    new_vm_id: "{{ cv_vm.id }}"
    new_vm_name: "{{ cv_vm.name }}"
